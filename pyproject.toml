[project]
name = "aere5460"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "NPY"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
